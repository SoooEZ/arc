# Overlay: docker compose -f compose.yaml -f compose.rails.yaml up -d --build --wait
# Only the api service is replaced; its hostname, port, and database stay the same.
services:
  api:
    build:
      context: .
      dockerfile: backend-rails/Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-arc}
      RAILS_ENV: production
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
