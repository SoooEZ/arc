server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    # Relative Location headers: an absolute one named the container's port 80, so the
    # documented base URL http://localhost:3080/api redirected to http://localhost/api/.
    absolute_redirect off;
    # The same JSON 413 as the API's RequestLimitFilter.rejectOversized, with CORS, so a client on
    # this origin can read it; nginx's own HTML page carried no Access-Control-Allow-Origin.
    error_page 413 = @request_too_large;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Docker's embedded DNS. A variable upstream is resolved per request, so a
    # recreated api container (with a new address) is found without restarting web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # default_type, not add_header: `return` already sets one Content-Type, and adding a second
    # left health clients reading application/octet-stream first.
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }

    location @request_too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 413 '{"status":413,"message":"Request body exceeds 1 MiB","issues":[]}';
    }

    location /api/ {
        # No URI part, so the original request URI is passed unchanged.
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Above the 30 s execution deadline, so the API's JSON 504 (with error
        # locations) arrives before nginx gives up with its own HTML 504.
        proxy_read_timeout 40s;
    }

    # Vite asset names contain a content hash: cache them for a year. A missing
    # asset is a 404, never index.html, so a stale page fails visibly instead of
    # running HTML as a script.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page names the current hashed assets, so browsers revalidate it every time.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
