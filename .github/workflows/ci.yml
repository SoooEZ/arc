name: Verify ARC
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test Java engine
        working-directory: backend
        run: mvn -B test
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build frontend
        working-directory: frontend
        run: npm run build
      - name: Start fresh Compose stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: API integration tests
        run: |
          python3 scripts/smoke.py
          python3 scripts/studio_smoke.py
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose down -v
