spring:
  application:
    name: arc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arc}
    username: ${DB_USER:arc}
    password: ${DB_PASSWORD:arc-local-development}
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
      # A misspelled field, a second document after the body or a fraction where a whole number
      # belongs (version 1.9) is a 400, never dropped or truncated into a different request.
      # Stored versions are read leniently (JsonCodec).
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
    # 20, never 2E+1: strict JSON clients reject or retype exponent notation.
    generator:
      write-bigdecimal-as-plain: true
  mvc:
    # No endpoint accepts form bodies, so never parse PUT/PATCH/DELETE form content into memory.
    formcontent:
      filter:
        enabled: false
  servlet:
    # No endpoint accepts multipart bodies either. Parsing one failed before routing, so a body
    # without a boundary was a 500 on every path; unparsed, it is a 415 (or the path's 404).
    multipart:
      enabled: false
logging:
  level:
    # ARC turns POI's error values into ArcExceptions, so POI's own ERROR with a stack trace per
    # failed RATE call and WARN per failed IRR call, even under $IFERROR, would only flood the log.
    org.apache.poi.ss.formula.functions: "off"
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

arc:
  http:
    allowed-hosts: ${ARC_HTTP_ALLOWED_HOSTS:}
    private-hosts: ${ARC_HTTP_PRIVATE_HOSTS:}
