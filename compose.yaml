name: ${COMPOSE_PROJECT_NAME:-arc}
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arc}
      POSTGRES_USER: ${POSTGRES_USER:-arc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arc-local-development}
    volumes:
      - arc-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-arc}
      DB_USER: ${POSTGRES_USER:-arc}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arc-local-development}
    ports:
      - "${ARC_API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${ARC_WEB_PORT:-3080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  arc-data:
